<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F6F5F1">
<meta name="htmx-config" content='{"scrollIntoViewOnBoost": false, "historyCacheSize": 0, "refreshOnHistoryMiss": true, "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "404", "swap": true, "error": false}, {"code": "[45]..", "swap": false, "error": true}]}'>
<title>{% block title %}MUS Booking{% endblock %}</title>
<link rel="icon" type="image/png" href="{{ static('icon.png') }}">
<link rel="apple-touch-icon" href="{{ static('icon.png') }}">
<link rel="manifest" href="{{ u('/manifest.webmanifest') }}">
<link rel="stylesheet" href="{{ static('fonts.css') }}">
<link rel="stylesheet" href="{{ static('app.css') }}">
<script src="{{ static('htmx.min.js') }}" defer></script>
<script src="{{ static('app.js') }}" defer></script>
</head>
<body hx-boost="true" class="{% block body_class %}{% endblock %}">
{% block body %}{% endblock %}
</body>
</html>
